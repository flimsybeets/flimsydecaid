# Push a tag like v0.2.0 to publish a GitHub Release with the installable zip.
# Then on the tablet: Launcher → Skins → cog → Install skin → GitHub Release
# → flimsybeets/flimsydecaid. "Check for updates" picks up later releases.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Package
        run: npm run package
        env:
          SKIN_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: skin-zip
          path: release/*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
